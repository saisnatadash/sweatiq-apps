name: Build SweatIQ APKs
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build both debug APKs
        run: gradle :deviceApp:assembleDebug :controlApp:assembleDebug --no-daemon --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp deviceApp/build/outputs/apk/debug/SweatIQ-Device-debug.apk dist/SweatIQ-Device.apk
          cp controlApp/build/outputs/apk/debug/SweatIQ-Control-debug.apk dist/SweatIQ-Control.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SweatIQ-APKs
          path: dist/*.apk
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apks-${{ github.run_number }}
          name: SweatIQ APKs (build ${{ github.run_number }})
          files: dist/*.apk
